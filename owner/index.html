<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#04f7f7">
  <meta name="robots" content="noindex">
  <title>RS Online Orders | Rustam Super Mart</title>
  <link rel="stylesheet" href="/owner/owner.css">
  <script src="/owner/owner.js" defer></script>
</head>

<body>
  <!-- Owner login -->
  <section class="login-view" id="loginView">
    <form class="login-card" id="loginForm">
      <div class="brand-mark">RS</div>
      <h1>RS Online Orders</h1>
      <p class="muted">Owner login</p>
      <label for="ownerPassword">Password</label>
      <input id="ownerPassword" type="password" autocomplete="current-password" required>
      <p class="form-error" id="loginError" role="alert" hidden></p>
      <button class="black-btn" type="submit" id="loginSubmit">Login</button>
    </form>
  </section>

  <!-- Owner app -->
  <div id="appView" hidden>
    <header class="top-bar">
      <div class="brand"><span class="brand-mark">RS</span><span>RS Online Orders</span></div>
      <nav class="tabs" id="tabs">
        <button type="button" class="tab active" data-tab="orders">Orders <span class="badge" id="newBadge" hidden>0</span></button>
        <button type="button" class="tab" data-tab="catalog">Collections &amp; Products</button>
        <button type="button" class="tab" data-tab="customers">Customers</button>
        <button type="button" class="tab" data-tab="settings">Payment Settings</button>
        <button type="button" class="tab" data-tab="billing">Billing</button>
        <button type="button" class="tab" data-tab="khata">Khata</button>
        <button type="button" class="tab" data-tab="inventory">Inventory</button>
      </nav>
      <div class="top-actions">
        <a class="ghost-btn" href="/" target="_blank" rel="noopener">View shop ↗</a>
        <button type="button" class="ghost-btn" id="logoutBtn">Logout</button>
      </div>
    </header>
    <main class="app-main" id="appMain">
      <section class="panel" id="panel-orders"></section>
      <section class="panel" id="panel-catalog" hidden></section>
      <section class="panel" id="panel-customers" hidden></section>
      <section class="panel" id="panel-settings" hidden></section>
      <section class="panel" id="panel-billing" hidden><iframe class="pos-frame" id="frame-billing" title="Billing"></iframe></section>
      <section class="panel" id="panel-khata" hidden><iframe class="pos-frame" id="frame-khata" title="Khata"></iframe></section>
      <section class="panel" id="panel-inventory" hidden><iframe class="pos-frame" id="frame-inventory" title="Inventory"></iframe></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="printArea"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>

</html>
